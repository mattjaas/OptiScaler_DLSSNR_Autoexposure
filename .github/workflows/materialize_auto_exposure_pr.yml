name: Materialize Auto Exposure PR

on:
  push:
    branches:
      - dlss-neural-rendering

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Save patch tools and reset to exact upstream base
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "autoexposure-tools"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $names = @("apply_dlssnr_autoexposure.py","apply_dlssnr_exposure_trim_anchors.py","apply_dlssnr_exposure_trim_fxc_fix.py","apply_dlssnr_whitepoint_trim_axis.py","apply_dlssnr_highlight_protected_autoexposure.py","apply_dlssnr_vulkan_trim_range.py","apply_dlssnr_vulkan_autoexposure.py","apply_dlssnr_vulkan_autoexposure_safety.py","embed_dlssnr_spirv.py")
          foreach ($name in $names) { Copy-Item ".\tools\$name" (Join-Path $toolDir $name) }
          git fetch https://github.com/y4my4my4m/OptiScaler_DLSSNR_Multipass_MFG.git 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8 --depth=1 --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard FETCH_HEAD
          git clean -fdx
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse HEAD).Trim() -ne "7b7220bbb4994a9c8ae60cfc75a44cb67995efb8") { Write-Error "Wrong upstream base"; exit 1 }

      - name: Apply all patches once and verify semantics
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "autoexposure-tools"
          $scripts = @("apply_dlssnr_autoexposure.py","apply_dlssnr_exposure_trim_anchors.py","apply_dlssnr_exposure_trim_fxc_fix.py","apply_dlssnr_whitepoint_trim_axis.py","apply_dlssnr_highlight_protected_autoexposure.py","apply_dlssnr_vulkan_trim_range.py","apply_dlssnr_vulkan_autoexposure.py","apply_dlssnr_vulkan_autoexposure_safety.py")
          foreach ($name in $scripts) { $script = Join-Path $toolDir $name; python -m py_compile $script; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python $script; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $dx12 = Get-Content ".\OptiScaler\shaders\dlssnr\DlssNr_Dx12.cpp" -Raw
          $vk = Get-Content ".\OptiScaler\dlssnr\DlssNrFeature_Vk.cpp" -Raw
          $vkh = Get-Content ".\OptiScaler\dlssnr\DlssNrFeature_Vk.h" -Raw
          $svk = Get-Content ".\OptiScaler\shaders\dlssnr\DlssNr_Vk.h" -Raw
          $menu = Get-Content ".\OptiScaler\dlssnr\DlssNr_Menu.cpp" -Raw
          $scan = Get-Content ".\OptiScaler\dlssnr\DlssNr_ExposureScan.cpp" -Raw
          $hlsl = Get-Content ".\OptiScaler\shaders\dlssnr\precompile\dlssnr.hlsl" -Raw
          $checks = @(@($dx12,'automaticExposureSelected'),@($dx12,'0\.25f, 50\.0f'),@($dx12,'baseWhitePoint = g_nr\.gamePreExposure / g_nr\.gameExposure'),@($vk,'DlssNrMode_AutoExposure'),@($vk,'kMeterSide = 64'),@($vk,'modelExposure = usingAutoExposure \? &g_vk\.autoExposure\.ngx : nullptr'),@($vkh,'AutoExposureStatusVk'),@($svk,'kSlotsPerFrame = 8'),@($menu,'Shadow protection from bright highlights'),@($menu,'Preview Trim value for actual scene'),@($menu,'Current base white point'),@($menu,'highest value that subjectively looks best'),@($menu,'this source is unavailable'),@($menu,'The game''s ExposureTexture is ignored even when present'),@($scan,'DlssNrWhitePointSource\.value_or_default\(\) == 3'),@($hlsl,'EffectiveExposureTrim'),@($hlsl,'baseWhitePoint = preExposure / exposure'),@($hlsl,'highlightKneeEv = lerp\(3\.0, 1\.0, protection\)'),@($hlsl,'highlightCompressionSlope = lerp\(1\.0, 0\.35, protection\)'),@($hlsl,'0\.18 / \(meteredSceneLuma \* 0\.82\)'))
          foreach ($c in $checks) { if ($c[0] -notmatch $c[1]) { Write-Error "Missing marker $($c[1])"; exit 1 } }
          if ($vk -match 'modelExposure = exposure' -or $menu -match 'Automatic exposure is currently available on D3D12 only' -or $hlsl -match 'deltaEv\s*<\s*-') { Write-Error "Forbidden old behavior remains"; exit 1 }

      - name: Compile both shaders
        shell: powershell
        run: |
          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { exit 1 }
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" /Fh "$dir\DlssNr_Shader.h" /Vn DlssNr_cso "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path $env:RUNNER_TEMP "dxc.zip"; $root = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241") { exit 1 }
          Expand-Archive $zip $root -Force
          $dxc = Get-ChildItem $root -Recurse -Filter dxc.exe | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          & $dxc.FullName -spirv -T cs_6_0 -E CSMain -D VK_MODE=1 -fvk-use-dx-layout -O3 -Fo "$dir\DlssNr_Shader.spv" "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $env:RUNNER_TEMP "autoexposure-tools\embed_dlssnr_spirv.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$dir\DlssNr_Shader.cso","$dir\DlssNr_Shader.spv" -ErrorAction SilentlyContinue

      - uses: microsoft/setup-msbuild@v3
      - name: Build Release x64
        shell: powershell
        run: |
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate diff, commit once, and push temporary source branch
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $changed | ForEach-Object { Write-Host $_ }
          if ($changed.Count -lt 10) { Write-Error "Diff too small"; exit 1 }
          foreach ($path in $changed) { if (-not $path.StartsWith("OptiScaler/")) { Write-Error "Unexpected $path"; exit 1 } }
          git add -u -- OptiScaler
          if (@(git diff --cached --name-only).Count -ne $changed.Count) { exit 1 }
          git config user.name "mattjaas"
          git config user.email "183701493+mattjaas@users.noreply.github.com"
          git commit -m "Add DLSS-NR automatic exposure, extend Trim support for game exposure, and add fine-tuned exposure control with anchor points"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-list --count 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8..HEAD).Trim() -ne "1") { exit 1 }
          git push origin HEAD:refs/heads/auto-exposure-pr-source --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "DIRECT_SOURCE_COMMIT=$(git rev-parse HEAD)"
