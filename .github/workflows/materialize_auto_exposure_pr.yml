name: Materialize Auto Exposure PR

on:
  push:
    branches:
      - dlss-neural-rendering

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Save release-time patch tools and reset to exact upstream base
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "autoexposure-tools"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $names = @(
            "apply_dlssnr_autoexposure.py",
            "apply_dlssnr_exposure_trim_anchors.py",
            "apply_dlssnr_exposure_trim_fxc_fix.py",
            "apply_dlssnr_whitepoint_trim_axis.py",
            "apply_dlssnr_highlight_protected_autoexposure.py",
            "apply_dlssnr_vulkan_trim_range.py",
            "apply_dlssnr_vulkan_autoexposure.py",
            "apply_dlssnr_vulkan_autoexposure_safety.py",
            "embed_dlssnr_spirv.py"
          )
          foreach ($name in $names) {
            Copy-Item ".\tools\$name" (Join-Path $toolDir $name)
          }
          git fetch https://github.com/y4my4my4m/OptiScaler_DLSSNR_Multipass_MFG.git 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8 --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8
          git clean -fdx
          git submodule sync --recursive
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse HEAD).Trim() -ne "7b7220bbb4994a9c8ae60cfc75a44cb67995efb8") {
            Write-Error "Did not reset to the exact upstream base"
            exit 1
          }

      - name: Apply all Auto Exposure patches once
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "autoexposure-tools"
          $scripts = @(
            "apply_dlssnr_autoexposure.py",
            "apply_dlssnr_exposure_trim_anchors.py",
            "apply_dlssnr_exposure_trim_fxc_fix.py",
            "apply_dlssnr_whitepoint_trim_axis.py",
            "apply_dlssnr_highlight_protected_autoexposure.py",
            "apply_dlssnr_vulkan_trim_range.py",
            "apply_dlssnr_vulkan_autoexposure.py",
            "apply_dlssnr_vulkan_autoexposure_safety.py"
          )
          foreach ($name in $scripts) {
            $script = Join-Path $toolDir $name
            python -m py_compile $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify final source semantics
        shell: powershell
        run: |
          $dx12 = Get-Content ".\OptiScaler\shaders\dlssnr\DlssNr_Dx12.cpp" -Raw
          $vk = Get-Content ".\OptiScaler\dlssnr\DlssNrFeature_Vk.cpp" -Raw
          $vkh = Get-Content ".\OptiScaler\dlssnr\DlssNrFeature_Vk.h" -Raw
          $shaderVk = Get-Content ".\OptiScaler\shaders\dlssnr\DlssNr_Vk.h" -Raw
          $menu = Get-Content ".\OptiScaler\dlssnr\DlssNr_Menu.cpp" -Raw
          $scan = Get-Content ".\OptiScaler\dlssnr\DlssNr_ExposureScan.cpp" -Raw
          $hlsl = Get-Content ".\OptiScaler\shaders\dlssnr\precompile\dlssnr.hlsl" -Raw
          $fwd = Get-Content ".\OptiScaler\dlssnr\forwarder\dlssnr_forwarder.cpp" -Raw

          $bad = $false
          $checks = @(
            @($dx12, 'automaticExposureSelected'),
            @($dx12, 'DlssNrAutoExposureTrim\.value_or_default\(\), 0\.25f, 50\.0f'),
            @($dx12, 'DlssNrAutoExposureShadowProtection'),
            @($dx12, 'AutoExposureStatus'),
            @($dx12, 'ExposureTrimForRuntime'),
            @($dx12, 'baseWhitePoint = g_nr\.gamePreExposure / g_nr\.gameExposure'),
            @($vk, 'DlssNrMode_AutoExposure'),
            @($vk, 'AutoExposureShadowProtection'),
            @($vk, 'autoExposure\.view'),
            @($vk, 'AutoExposureStatusVk'),
            @($vk, 'FillAutoExposureTrimConstantsVk'),
            @($vk, 'kMeterSide = 64'),
            @($vk, 'modelExposure = usingAutoExposure \? &g_vk\.autoExposure\.ngx : nullptr'),
            @($vkh, 'AutoExposureStatusVk'),
            @($shaderVk, 'kSlotsPerFrame = 8'),
            @($fwd, 'ExposureTexture'),
            @($menu, 'Trim \(x the game''s exposure\)'),
            @($menu, 'Trim \(x automatic exposure\)'),
            @($menu, 'Shadow protection from bright highlights'),
            @($menu, '0%: original full-frame arithmetic average'),
            @($menu, '100%: strongest protection'),
            @($menu, 'Preview Trim value for actual scene'),
            @($menu, 'Add Anchor point'),
            @($menu, 'Current base white point'),
            @($menu, 'highest value that subjectively looks best'),
            @($menu, 'this source is unavailable'),
            @($menu, 'The game''s ExposureTexture is ignored even when present'),
            @($scan, 'DlssNrWhitePointSource\.value_or_default\(\) == 3'),
            @($hlsl, 'EffectiveExposureTrim'),
            @($hlsl, 'InterpolateExposureTrimSegment'),
            @($hlsl, 'baseWhitePoint = preExposure / exposure'),
            @($hlsl, 'gAutoExposureShadowProtection'),
            @($hlsl, 'weightedSceneLogLuma'),
            @($hlsl, 'highlightKneeEv = lerp\(3\.0, 1\.0, protection\)'),
            @($hlsl, 'highlightCompressionSlope = lerp\(1\.0, 0\.35, protection\)'),
            @($hlsl, 'compressedSceneLuma'),
            @($hlsl, 'gMotion\.Load\(int3\(0, 0, 0\)\)\.r'),
            @($hlsl, '0\.18 / \(meteredSceneLuma \* 0\.82\)'),
            @($hlsl, 'gExposureTrimAnchorCount')
          )
          foreach ($check in $checks) {
            if ($check[0] -notmatch $check[1]) {
              Write-Host "Missing marker: $($check[1])"
              $bad = $true
            }
          }
          if ($vk -match 'modelExposure = exposure') { Write-Host "Foreign game exposure is passed to the Vulkan model"; $bad = $true }
          if ($menu -match 'Automatic exposure is currently available on D3D12 only') { Write-Host "Obsolete D3D12-only message remains"; $bad = $true }
          if ($hlsl -match 'deltaEv\s*<\s*-') { Write-Host "Unexpected dark-side compression remains"; $bad = $true }
          if ($bad) { exit 1 }

      - name: Compile D3D12 shader with FXC
        shell: powershell
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { Write-Error "fxc.exe not found"; exit 1 }
          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" /Fh "$dir\DlssNr_Shader.h" /Vn DlssNr_cso "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Vulkan shader with pinned official DXC and embed it
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "dxc_2026_07_29.zip"
          $root = Join-Path $env:RUNNER_TEMP "dxc_spirv"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241") { Write-Error "DXC SHA256 mismatch"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $dxc = Get-ChildItem $root -Recurse -Filter dxc.exe | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $dxc) { Write-Error "SPIR-V-capable dxc.exe not found"; exit 1 }
          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          & $dxc.FullName -spirv -T cs_6_0 -E CSMain -D VK_MODE=1 -fvk-use-dx-layout -O3 -Fo "$dir\DlssNr_Shader.spv" "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $env:RUNNER_TEMP "autoexposure-tools\embed_dlssnr_spirv.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item "$dir\DlssNr_Shader.cso" -ErrorAction SilentlyContinue
          Remove-Item "$dir\DlssNr_Shader.spv" -ErrorAction SilentlyContinue

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build direct-source tree Release x64
        shell: powershell
        run: |
          msbuild /m /p:Configuration=Release . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate diff and create one clean commit
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          Write-Host "Changed tracked files:"
          $changed | ForEach-Object { Write-Host "  $_" }
          if ($changed.Count -lt 10) { Write-Error "Unexpectedly small direct-source diff"; exit 1 }
          foreach ($path in $changed) {
            if (-not $path.StartsWith("OptiScaler/")) { Write-Error "Unexpected changed file: $path"; exit 1 }
            if ($path.StartsWith("tools/") -or $path -like ".github/*") { Write-Error "Patch/workflow file leaked into PR tree: $path"; exit 1 }
          }
          if (-not (git ls-files "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h")) { Write-Error "Generated D3D12 header is not tracked"; exit 1 }
          if (-not (git ls-files "OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader_Vk.h")) { Write-Error "Generated Vulkan header is not tracked"; exit 1 }
          git add -u -- OptiScaler
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne $changed.Count) { Write-Error "Staged file set does not match tracked diff"; exit 1 }
          git config user.name "mattjaas"
          git config user.email "183701493+mattjaas@users.noreply.github.com"
          git commit -m "Add DLSS-NR automatic exposure, extend Trim support for game exposure, and add fine-tuned exposure control with anchor points"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-list --count 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8..HEAD).Trim() -ne "1") { Write-Error "Materialized branch is not exactly one commit ahead"; exit 1 }
          git push origin HEAD:refs/heads/auto-exposure-pr-source --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "DIRECT_SOURCE_COMMIT=$(git rev-parse HEAD)"
