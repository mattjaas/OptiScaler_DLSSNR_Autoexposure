name: DLSS-NR Auto Exposure - Build to Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply DLSS-NR Auto Exposure patch in runner only
        shell: powershell
        run: |
          python -m py_compile .\tools\apply_dlssnr_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_exposure_trim_anchors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_exposure_trim_fxc_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_whitepoint_trim_axis.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_highlight_protected_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_vulkan_trim_range.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_vulkan_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\apply_dlssnr_vulkan_autoexposure_safety.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m py_compile .\tools\embed_dlssnr_spirv.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_exposure_trim_anchors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_exposure_trim_fxc_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_whitepoint_trim_axis.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_highlight_protected_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_vulkan_trim_range.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_vulkan_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\apply_dlssnr_vulkan_autoexposure_safety.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Structural checks before spending time on FXC/DXC/MSBuild.
          $dx12 = Get-Content "${{ github.workspace }}\OptiScaler\shaders\dlssnr\DlssNr_Dx12.cpp" -Raw
          $vk = Get-Content "${{ github.workspace }}\OptiScaler\dlssnr\DlssNrFeature_Vk.cpp" -Raw
          $vkh = Get-Content "${{ github.workspace }}\OptiScaler\dlssnr\DlssNrFeature_Vk.h" -Raw
          $shaderVk = Get-Content "${{ github.workspace }}\OptiScaler\shaders\dlssnr\DlssNr_Vk.h" -Raw
          $fwd = Get-Content "${{ github.workspace }}\OptiScaler\dlssnr\forwarder\dlssnr_forwarder.cpp" -Raw
          $menu = Get-Content "${{ github.workspace }}\OptiScaler\dlssnr\DlssNr_Menu.cpp" -Raw
          $scan = Get-Content "${{ github.workspace }}\OptiScaler\dlssnr\DlssNr_ExposureScan.cpp" -Raw
          $hlsl = Get-Content "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile\dlssnr.hlsl" -Raw

          if ($dx12 -notmatch 'automaticExposureSelected' -or
              $dx12 -notmatch 'DlssNrAutoExposureTrim\.value_or_default\(\), 0\.25f, 50\.0f' -or
              $dx12 -notmatch 'DlssNrAutoExposureShadowProtection' -or
              $dx12 -notmatch 'AutoExposureStatus' -or
              $dx12 -notmatch 'ExposureTrimForRuntime' -or
              $dx12 -notmatch 'baseWhitePoint = g_nr\.gamePreExposure / g_nr\.gameExposure' -or
              $vk -notmatch 'DlssNrMode_AutoExposure' -or
              $vk -notmatch 'AutoExposureShadowProtection' -or
              $vk -notmatch 'autoExposure\.view' -or
              $vk -notmatch 'AutoExposureStatusVk' -or
              $vk -notmatch 'FillAutoExposureTrimConstantsVk' -or
              $vk -notmatch 'kMeterSide = 64' -or
              $vk -notmatch '0\.25f, 50\.0f' -or
              $vk -notmatch 'modelExposure = usingAutoExposure \? &g_vk\.autoExposure\.ngx : nullptr' -or
              $vk -match 'modelExposure = exposure' -or
              $vkh -notmatch 'AutoExposureStatusVk' -or
              $shaderVk -notmatch 'kSlotsPerFrame = 8' -or
              $fwd -notmatch 'ExposureTexture' -or
              $menu -notmatch 'Automatic exposure' -or
              $menu -notmatch 'Trim \(x automatic exposure\).*50\.0f' -or
              $menu -notmatch 'Shadow protection from bright highlights' -or
              $menu -notmatch '0%: original full-frame arithmetic average' -or
              $menu -notmatch '100%: strongest protection' -or
              $menu -notmatch 'Preview Trim value for actual scene' -or
              $menu -notmatch 'Add Anchor point' -or
              $menu -notmatch 'Current base white point' -or
              $menu -notmatch 'AutoExposureStatusVk' -or
              $menu -match 'Automatic exposure is currently available on D3D12 only' -or
              $menu -notmatch 'if \(wpSource == 3\)' -or
              $scan -notmatch 'DlssNrWhitePointSource\.value_or_default\(\) == 3' -or
              $hlsl -notmatch 'EffectiveExposureTrim' -or
              $hlsl -notmatch 'InterpolateExposureTrimSegment' -or
              $hlsl -notmatch 'baseWhitePoint = preExposure / exposure' -or
              $hlsl -notmatch 'gAutoExposureShadowProtection' -or
              $hlsl -notmatch 'weightedSceneLogLuma' -or
              $hlsl -notmatch 'highlightKneeEv = lerp\(3\.0, 1\.0, protection\)' -or
              $hlsl -notmatch 'highlightCompressionSlope = lerp\(1\.0, 0\.35, protection\)' -or
              $hlsl -notmatch 'compressedSceneLuma' -or
              $hlsl -notmatch 'gMotion\.Load\(int3\(0, 0, 0\)\)\.r' -or
              $hlsl -notmatch '0\.18 / \(meteredSceneLuma \* 0\.82\)' -or
              $hlsl -notmatch 'gExposureTrimAnchorCount') {
            Write-Error "Patch completed but expected D3D12/Vulkan Auto Exposure / Trim Anchor markers are missing."
            exit 1
          }

      - name: Compile DLSS-NR D3D12 shader with FXC
        shell: powershell
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $fxc) {
            Write-Error "fxc.exe was not found in the Windows SDK on windows-latest."
            exit 1
          }

          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          Write-Host "Using FXC: $($fxc.FullName)"

          & $fxc.FullName `
            /nologo `
            /T cs_5_0 `
            /E CSMain `
            /O3 `
            /Fo "$dir\DlssNr_Shader.cso" `
            /Fh "$dir\DlssNr_Shader.h" `
            /Vn DlssNr_cso `
            "$dir\dlssnr.hlsl"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "$dir\DlssNr_Shader.h")) {
            Write-Error "FXC did not generate DlssNr_Shader.h"
            exit 1
          }

      - name: Compile DLSS-NR Vulkan shader with official DXC
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "dxc_2026_07_29.zip"
          $dxcRoot = Join-Path $env:RUNNER_TEMP "dxc_spirv"
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip" -OutFile $zip

          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "a1dfb116ba3eeae6a1582291b53a8e7bf65ad760676bd3194685c8f7367cd241"
          if ($actualHash -ne $expectedHash) {
            Write-Error "DXC archive SHA256 mismatch"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $dxcRoot -Force
          $dxc = Get-ChildItem $dxcRoot -Recurse -Filter dxc.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1

          if (-not $dxc) {
            Write-Error "Official SPIR-V-capable dxc.exe not found after extraction"
            exit 1
          }

          Write-Host "Using DXC: $($dxc.FullName)"
          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"

          & $dxc.FullName `
            -spirv `
            -T cs_6_0 `
            -E CSMain `
            -D VK_MODE=1 `
            -fvk-use-dx-layout `
            -O3 `
            -Fo "$dir\DlssNr_Shader.spv" `
            "$dir\dlssnr.hlsl"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python .\tools\embed_dlssnr_spirv.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "$dir\DlssNr_Shader_Vk.h")) {
            Write-Error "DXC/embed step did not generate DlssNr_Shader_Vk.h"
            exit 1
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build Release x64
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release packages
        id: package
        shell: powershell
        run: |
          $out = "${{ github.workspace }}\x64\Release\a"

          if (-not (Test-Path $out)) {
            Write-Error "Expected build output not found: $out"
            exit 1
          }

          if (Test-Path "${{ github.workspace }}\dist\README.md") {
            Copy-Item "${{ github.workspace }}\dist\README.md" "$out\README.md" -Force
          }

          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $baseName = "OptiScaler_DLSSNR_AutoExposure_${shortSha}_run${{ github.run_number }}.${{ github.run_attempt }}"
          $plain = "${{ github.workspace }}\$baseName.7z"
          $withDlss = "${{ github.workspace }}\${baseName}_with_DLSS.7z"

          7z a -r $plain "$out\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $streamlineTarget = "$out\OptiScaler\streamline"
          New-Item -ItemType Directory -Force -Path $streamlineTarget | Out-Null

          if (Test-Path "${{ github.workspace }}\dist\streamline") {
            Copy-Item "${{ github.workspace }}\dist\streamline\*" $streamlineTarget -Force
          }

          if (Test-Path "${{ github.workspace }}\dist\nvngx") {
            Copy-Item "${{ github.workspace }}\dist\nvngx\*" "$out\OptiScaler\" -Force
          }

          7z a -r $withDlss "$out\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "plain=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "with_dlss=$withDlss" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish directly to GitHub Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autoexposure-build-${{ github.run_number }}.${{ github.run_attempt }}"
          $title = "DLSS-NR Auto Exposure build ${{ github.run_number }}.${{ github.run_attempt }}"

          $notes = @"
          Experimental DLSS Neural Rendering Auto Exposure build.

          Source branch: ${{ github.ref_name }}
          Clean source commit: ${{ github.sha }}

          White point sources:
          - Paper white only;
          - The game's own exposure: uses only the game's ExposureTexture, trim up to 50x;
          - Automatic exposure: calculates exposure on GPU from original linear HDR on D3D12 and native Vulkan, ignores game ExposureTexture, trim up to 50x;
          - A buffer the scan found: calibrated scan path; meter and anchors appear only for this source.

          Automatic exposure keeps the original arithmetic-average exposure formula and exposes a "Shadow protection from bright highlights" slider, default 100%. At 0% it uses the exact original full-frame arithmetic average. At 100%, highlight compression starts at +1 EV above the smooth full-frame log-luminance reference and additional brightness grows at 35% of its original EV rate. Intermediate slider values linearly interpolate the knee from +3 to +1 EV and the slope from 1.00 to 0.35. Every tile remains in the meter; the final metered luminance remains a pixel-area-weighted linear arithmetic mean with no histogram-bin or percentile-boundary selection.

          Game exposure and Automatic exposure support Base White Point-dependent Trim Anchor points. Each point stores the untrimmed Base White Point (PreExposure / Exposure) and the selected Trim. With no points the Trim slider is used, one point fixes Trim for the whole range, and multiple points are interpolated logarithmically between Base White Point values. The Preview Trim value for actual scene option temporarily bypasses anchors while calibrating a new point.

          On both D3D12 and Vulkan, Automatic exposure is calculated once before Encode and the same 1x1 GPU value is reused by Encode, the Neural Rendering model and Resolve. Its Trim anchors are evaluated against the same-frame Base White Point on GPU; the CPU readback is only for menu/status and Anchor-point capture.

          This workflow never commits patched sources back to the branch and does not use actions/upload-artifact.
          "@

          $notesFile = Join-Path $env:RUNNER_TEMP "autoexposure-release-notes.md"
          $notes | Set-Content -Path $notesFile -Encoding utf8

          gh release create $tag `
            --target "${{ github.sha }}" `
            --title $title `
            --notes-file $notesFile

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release upload $tag `
            "${{ steps.package.outputs.plain }}" `
            "${{ steps.package.outputs.with_dlss }}" `
            --clobber

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release view $tag --json url --jq .url
