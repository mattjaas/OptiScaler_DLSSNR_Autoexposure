name: DLSS-NR Auto Exposure - Build to Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply GPU auto-exposure source patch
        shell: powershell
        run: |
          python .\tools\apply_dlssnr_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save readable source patch
        shell: powershell
        run: |
          git diff -- `
            OptiScaler/shaders/dlssnr/DlssNr_Common.h `
            OptiScaler/shaders/dlssnr/DlssNr_Dx12.h `
            OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl `
            OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp `
            OptiScaler/dlssnr/forwarder/dlssnr_forwarder.cpp `
            | Out-File -Encoding utf8 "${{ github.workspace }}\DLSSNR_AutoExposure_source.patch"

      - name: Compile DLSS-NR D3D12 shader with FXC
        shell: powershell
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $fxc) {
            Write-Error "fxc.exe was not found in the Windows SDK on windows-latest."
            exit 1
          }

          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          Write-Host "Using FXC: $($fxc.FullName)"

          & $fxc.FullName `
            /nologo `
            /T cs_5_0 `
            /E CSMain `
            /O3 `
            /Fo "$dir\DlssNr_Shader.cso" `
            /Fh "$dir\DlssNr_Shader.h" `
            /Vn DlssNr_cso `
            "$dir\dlssnr.hlsl"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "$dir\DlssNr_Shader.h")) {
            Write-Error "FXC did not generate DlssNr_Shader.h"
            exit 1
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} . /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Persist patched sources after successful build
        id: source_commit
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- `
            OptiScaler/shaders/dlssnr/DlssNr_Common.h `
            OptiScaler/shaders/dlssnr/DlssNr_Dx12.h `
            OptiScaler/shaders/dlssnr/precompile/dlssnr.hlsl `
            OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.cso `
            OptiScaler/shaders/dlssnr/precompile/DlssNr_Shader.h `
            OptiScaler/shaders/dlssnr/DlssNr_Dx12.cpp `
            OptiScaler/dlssnr/forwarder/dlssnr_forwarder.cpp

          git diff --cached --quiet
          $noChanges = ($LASTEXITCODE -eq 0)

          if (-not $noChanges) {
            git commit -m "DLSS-NR: add GPU auto exposure fallback"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git push origin "HEAD:${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $releaseSha = (git rev-parse HEAD).Trim()
          "sha=$releaseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release source commit: $releaseSha"

      - name: Prepare release packages
        id: package
        shell: powershell
        run: |
          $out = "${{ github.workspace }}\x64\Release\a"

          if (-not (Test-Path $out)) {
            Write-Error "Expected build output not found: $out"
            exit 1
          }

          if (Test-Path "${{ github.workspace }}\dist\README.md") {
            Copy-Item "${{ github.workspace }}\dist\README.md" "$out\README.md" -Force
          }

          $shortSha = "${{ steps.source_commit.outputs.sha }}".Substring(0, 7)
          $baseName = "OptiScaler_DLSSNR_AutoExposure_${shortSha}_run${{ github.run_number }}.${{ github.run_attempt }}"
          $plain = "${{ github.workspace }}\$baseName.7z"
          $withDlss = "${{ github.workspace }}\${baseName}_with_DLSS.7z"

          # Plain loader package first.
          7z a -r $plain "$out\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Then add redistributables and cut the second package.
          $streamlineTarget = "$out\OptiScaler\streamline"
          New-Item -ItemType Directory -Force -Path $streamlineTarget | Out-Null

          if (Test-Path "${{ github.workspace }}\dist\streamline") {
            Copy-Item "${{ github.workspace }}\dist\streamline\*" $streamlineTarget -Force
          }

          if (Test-Path "${{ github.workspace }}\dist\nvngx") {
            Copy-Item "${{ github.workspace }}\dist\nvngx\*" "$out\OptiScaler\" -Force
          }

          7z a -r $withDlss "$out\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "plain=$plain" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "with_dlss=$withDlss" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish directly to GitHub Releases
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "autoexposure-build-${{ github.run_number }}.${{ github.run_attempt }}"
          $title = "DLSS-NR Auto Exposure build ${{ github.run_number }}.${{ github.run_attempt }}"

          $notes = @"
          Experimental DLSS Neural Rendering Auto Exposure build.

          Source branch: ${{ github.ref_name }}
          Release source commit: ${{ steps.source_commit.outputs.sha }}

          Auto exposure behavior:
          - game ExposureTexture is preferred when present;
          - otherwise AverageLuma is measured from original linear HDR on GPU;
          - Exposure = 0.18 / (AverageSceneLuma * 0.82);
          - PreExposure is accounted for;
          - one exposure value is shared by Encode, all NR passes and Resolve;
          - exposure is not recalculated between Multipass passes;
          - generated exposure is also supplied to NGX as standard ExposureTexture.

          This workflow does NOT use actions/upload-artifact.
          "@

          gh release create $tag `
            "${{ steps.package.outputs.plain }}" `
            "${{ steps.package.outputs.with_dlss }}" `
            "${{ github.workspace }}\DLSSNR_AutoExposure_source.patch" `
            --target "${{ steps.source_commit.outputs.sha }}" `
            --title $title `
            --notes $notes

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          gh release view $tag --json url --jq .url
