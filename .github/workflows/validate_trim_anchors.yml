name: Validate exposure Trim anchors

on:
  push:
    branches:
      - exposure-trim-anchors

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Apply release-only patches
        shell: powershell
        run: |
          python -m py_compile .\tools\apply_dlssnr_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .\tools\apply_dlssnr_exposure_trim_anchors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile .\tools\apply_dlssnr_exposure_trim_fxc_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\apply_dlssnr_autoexposure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\apply_dlssnr_exposure_trim_anchors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tools\apply_dlssnr_exposure_trim_fxc_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile D3D12 shader
        shell: powershell
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { Write-Error "fxc.exe not found"; exit 1 }
          $dir = "${{ github.workspace }}\OptiScaler\shaders\dlssnr\precompile"
          Write-Host "Using FXC: $($fxc.FullName)"
          $fxcOutput = & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" /Fh "$dir\DlssNr_Shader.h" /Vn DlssNr_cso "$dir\dlssnr.hlsl" 2>&1
          $fxcExit = $LASTEXITCODE
          $fxcOutput | ForEach-Object { Write-Host $_ }
          Write-Host "FXC exit code: $fxcExit"
          if ($fxcExit -ne 0) { exit $fxcExit }
